name: Deploy Website to GoDaddy

on:
  push:
    branches:
      - main  # Trigger the action on push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v2

    # Step 2: Set up FTP deployment
    - name: Deploy to GoDaddy via FTP
      run: |
        apt-get install lftp  # Install lftp tool to use FTP
        lftp -f "
          open ftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_SERVER }}
          lcd ./ # Local directory (current repo folder)
          cd ${{ secrets.REMOTE_DIR }} # Remote directory (e.g., public_html)
          mirror -R --delete --verbose ./ ./
          bye
        "

