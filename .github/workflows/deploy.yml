name: 🚀 Deploy to GoDaddy via FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: FTP Deploy to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5   # ← pin a real tag
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./                             # adjust if your build output lives elsewhere
          remote-dir: /public_html                  # adjust your web‑root path
          git-ftp-args: --insecure                  # optional: relax TLS if GoDaddy FTPS is picky
