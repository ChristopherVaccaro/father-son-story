name: 🚀 Deploy to GoDaddy via FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Grab your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Upload via FTP
      - name: FTP Deploy to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_HOST }}       # e.g. ftp.yourdomain.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Path in your repo containing your HTML/CSS. Default is root.
          local-dir: ./                         

          # Remote path on GoDaddy; adjust if your docs root is e.g. /public_html
          remote-dir: /public_html              

          # Sometimes GoDaddy’s FTP is finicky; --insecure relaxes strict TLS.
          git-ftp-args: --insecure               
